name: Latest blog post workflow

on:
  schedule:
    # Runs daily at 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch: # Allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest ajeetraina.com posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest posts from ajeetraina.com RSS feed
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.ajeetraina.com/rss/"
          max_post_count: 16
          disable_html_encoding: true
          commit_message: "Update latest ajeetraina.com blog posts"
