name: Docker blog posts workflow

on:
  schedule:
    # Runs daily at 01:30 UTC — offset from the ajeetraina.com feed workflow
    # (00:30) so the two never push to main at the same time.
    - cron: "30 1 * * *"
  workflow_dispatch: # Allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-readme-with-docker-posts:
    name: Update README with latest docker.com posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scrape contributor page and update README
        run: python3 scripts/update_docker_posts.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "blog-post-bot"
          git config user.email "blog-post-bot@users.noreply.github.com"
          git add README.md
          git commit -m "Update latest docker.com blog posts"
          git push
